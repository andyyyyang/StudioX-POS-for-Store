# UI 截圖：在 GitHub 的 Mac 上用 iPad 模擬器打開示範店（餐廳咖啡、服飾、美業、健身、夜市外帶＋叫號）的每個畫面，
# 截圖縮小後提交回這個分支的 docs/screenshots/（深色）與 docs/screenshots/light/（淺色），也放在這次執行的 artifact。
# 再用 iPhone 模擬器拍店員手上的點餐機（直的）：docs/screenshots/phone/。
# 提交訊息有 [screenshots] 才跑（Mac 的分鐘數比較貴），也可以手動 Run workflow。
# 和 StudioX Console App 的 ui-screenshots.yml 同一套做法。
name: UI 截圖

on:
  workflow_dispatch:
  push:
    paths:
      - "StudioXPOS/**"
      - "StudioXPOS.xcodeproj/**"
      - "Packages/POSKit/**"
      - ".github/workflows/ui-screenshots.yml"

permissions:
  contents: write

jobs:
  shots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    concurrency:
      group: ui-screenshots-${{ github.ref }}
      cancel-in-progress: true
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: 選 Xcode（最新的）
        run: |
          best=""; bestv="0"
          for app in /Applications/Xcode*.app; do
            v=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist" 2>/dev/null) || continue
            if [ "$v" != "$bestv" ] && [ "$(printf '%s\n%s\n' "$bestv" "$v" | sort -V | tail -1)" = "$v" ]; then best="$app"; bestv="$v"; fi
          done
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version
          echo "SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)" >> "$GITHUB_ENV"

      - name: 編譯（模擬器、Debug：示範模式與啟動參數只在 Debug）
        run: |
          set -o pipefail
          xcodebuild build \
            -project StudioXPOS.xcodeproj \
            -scheme StudioXPOS \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET="$SIM_SDK" \
            2>&1 | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: 選 iPad、iPhone 模擬器
        run: |
          xcrun simctl list devices available -j > devices.json
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, re
          d = json.load(open("devices.json"))["devices"]
          ios = sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in re.findall(r"\d+", k)])
          devs = [x for k in reversed(ios) for x in d[k]]
          for p in ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)", "iPad Air 13-inch (M3)", "iPad Pro 11-inch (M4)"]:
              hit = next((x for x in devs if x["name"] == p), None)
              if hit: print("IPAD=" + hit["udid"]); break
          else:
              print("IPAD=" + next(x for x in devs if x["name"].startswith("iPad"))["udid"])
          # iPhone：最新的「iPhone N Pro」（沒有就 Pro Max、再沒有就任何一台 iPhone）
          def newest(pattern):
              hits = [(int(m.group(1)), x) for x in devs for m in [re.fullmatch(pattern, x["name"])] if m]
              return max(hits, key=lambda h: h[0])[1] if hits else None
          phone = newest(r"iPhone (\d+) Pro") or newest(r"iPhone (\d+) Pro Max") or next((x for x in devs if x["name"].startswith("iPhone")), None)
          if phone:
              print("IPHONE=" + phone["udid"])
              print("IPHONE_NAME=" + phone["name"])
          PY

      # 提交訊息有 [phone-only]：只拍 iPhone（查手機的問題時省時間）
      - name: 截圖
        if: "!contains(github.event.head_commit.message, '[phone-only]')"
        timeout-minutes: 44
        continue-on-error: true
        run: |
          app="build/Build/Products/Debug-iphonesimulator/StudioXPOS.app"
          bundle=tw.studiox.pos
          mkdir -p shots
          L="-landscape -autologin 1234"
          # 名稱|啟動參數|等幾秒（預設 7）
          scenes=(
            "00-pairing||6"
            "01-cafe-lock|-demo cafe -landscape"
            "02-cafe-floor|-demo cafe $L -section floor"
            "03-cafe-order|-demo cafe $L -section order"
            "04-cafe-orders|-demo cafe $L -section orders"
            "05-cafe-kitchen|-demo cafe $L -section kitchen"
            "06-cafe-dashboard|-demo cafe $L -section dashboard"
            "07-cafe-reservations|-demo cafe $L -section reservations"
            "08-cafe-shift|-demo cafe $L -section shift"
            "09-cafe-settings|-demo cafe $L -section settings"
            "10-counter-order|-demo cafe -serviceMode counter $L -section order"
            "11-expo|-demo cafe -workstation expo $L"
            "12-cafe-queue|-demo cafe $L -section queue"
            # 掃碼（條碼機或相機，POSModel.handleScan）：掃到折價券 VIP10 → 單子上「折價券 VIP 9 折」
            "13-cafe-coupon|-demo cafe $L -section order -scanDemo VIP10"
            # 現金模式（設定 → 營業模式）：打 120 → 大鍵「收現金 NT$120」
            "14-yellowgirl-cash|-demo yellowgirl $L -section order -cashMode YES -typeDigits 120|10"
            "20-apparel-order|-demo apparel $L -section order"
            "21-apparel-orders|-demo apparel $L -section orders"
            "22-apparel-dashboard|-demo apparel $L -section dashboard"
            "30-salon-appointments|-demo salon $L -section appointments"
            "31-salon-order|-demo salon $L -section order"
            "32-salon-members|-demo salon $L -section members"
            "33-salon-dashboard|-demo salon $L -section dashboard"
            "34-salon-reception|-demo salon -workstation reception $L"
            "40-fitness-checkin|-demo fitness $L -section checkIn"
            "41-fitness-members|-demo fitness $L -section members"
            "42-fitness-order|-demo fitness $L -section order"
            "43-fitness-dashboard|-demo fitness $L -section dashboard"
            # 選起來之後：動作都在右欄（-preselect：每頁先選起第一筆）
            "50-cafe-floor-selected|-demo cafe $L -section floor -preselect"
            "51-cafe-reservation-selected|-demo cafe $L -section reservations -preselect"
            "52-cafe-order-line|-demo cafe $L -section order -preselect"
            "53-cafe-kitchen-selected|-demo cafe $L -section kitchen -preselect"
            "54-apparel-sale-selected|-demo apparel $L -section orders -preselect"
            "55-salon-appointment-selected|-demo salon $L -section appointments -preselect"
            "56-salon-member-selected|-demo salon $L -section members -preselect"
            "57-fitness-checkin-selected|-demo fitness $L -section checkIn -preselect"
            "58-cafe-queue-selected|-demo cafe $L -section queue -preselect"
            # 黃毛丫頭（夜市滷味攤，全外帶＋叫號）：右欄最上面的叫號卡、叫號頁的外帶單、廚房的大號碼
            "60-yellowgirl-order|-demo yellowgirl $L -section order"
            "61-yellowgirl-queue|-demo yellowgirl $L -section queue"
            "62-yellowgirl-kitchen|-demo yellowgirl $L -section kitchen"
          )
          # 淺色再拍一輪（外觀預設跟著 iPad）
          light=(
            "01-cafe-lock|-demo cafe -landscape"
            "02-cafe-floor|-demo cafe $L -section floor"
            "03-cafe-order|-demo cafe $L -section order"
            "07-cafe-reservations|-demo cafe $L -section reservations"
            "12-cafe-queue|-demo cafe $L -section queue"
            "21-apparel-orders|-demo apparel $L -section orders"
            "30-salon-appointments|-demo salon $L -section appointments"
            "32-salon-members|-demo salon $L -section members"
            "40-fitness-checkin|-demo fitness $L -section checkIn"
            "50-cafe-floor-selected|-demo cafe $L -section floor -preselect"
            "56-salon-member-selected|-demo salon $L -section members -preselect"
            "60-yellowgirl-order|-demo yellowgirl $L -section order"
          )
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          dev="$IPAD"
          echo "== 開機 $(date +%T)"
          limit 60 xcrun simctl boot "$dev" || true
          limit 300 xcrun simctl bootstatus "$dev" -b || true
          limit 30 xcrun simctl status_bar "$dev" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          limit 30 xcrun simctl ui "$dev" appearance dark || true
          # 收銀台是橫的：打開 Simulator 轉一次（⌘←）。這台 Mac 不給輔助使用權限時就照直的截
          open -a Simulator --args -CurrentDeviceUDID "$dev" || true
          sleep 20
          # 轉成功就記下來：截圖是照直的畫面存的，縮圖時要轉回來
          if limit 20 osascript -e 'tell application "Simulator" to activate' -e 'delay 1' \
            -e 'tell application "System Events" to key code 123 using {command down}'; then touch shots/.rotated; else echo "   轉不了，照直的截"; fi
          sleep 4
          shoot() {  # 一張：名稱|啟動參數|等幾秒 → shots/<資料夾>/<名稱>.png
            local dir="$1" scene="$2"
            IFS='|' read -r name args wait <<< "$scene"
            echo "-- $dir$name $(date +%T)"
            limit 20 xcrun simctl terminate "$dev" "$bundle" 2>/dev/null || true
            # 每張都重新安裝：示範模式的資料、這台的設定都從乾淨的開始
            limit 30 xcrun simctl uninstall "$dev" "$bundle" 2>/dev/null || true
            limit 180 xcrun simctl install "$dev" "$app" || echo "   安裝逾時"
            limit 60 xcrun simctl launch "$dev" "$bundle" $args >/dev/null || echo "   啟動逾時"
            sleep "${wait:-7}"
            limit 30 xcrun simctl io "$dev" screenshot "shots/$dir$name.png" >/dev/null 2>&1 || echo "   截圖逾時"
          }
          for scene in "${scenes[@]}"; do shoot "" "$scene"; done
          mkdir -p shots/light
          limit 30 xcrun simctl ui "$dev" appearance light || true
          sleep 2
          for scene in "${light[@]}"; do shoot "light/" "$scene"; done
          limit 60 xcrun simctl shutdown "$dev" || true
          ls shots | wc -l

      # 列印實測：App 從網路（TCP 9100，和店裡一樣）送到三台虛擬出單機（tools/escpos-emulator），畫成圖片 → docs/print-samples/
      #   9100：58 mm Big5（收據、證明聯、號碼牌、錢櫃）  9101：80 mm Big5（廚房）  9102：80 mm 圖片模式（收據，照單據樣式）
      #   58、80 另外各印一張黃毛丫頭單據樣式的取餐單（圖片：店標、底圖網點、印章、頁尾），和文字版對照
      - name: 列印實測（58／80 mm）
        if: "!contains(github.event.head_commit.message, '[phone-only]')"
        timeout-minutes: 12
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/escpos" && "$RUNNER_TEMP/escpos/bin/pip" install --quiet pillow qrcode
          PY="$RUNNER_TEMP/escpos/bin/python"
          E=tools/escpos-emulator/escpos_emulator.py
          mkdir -p prints
          "$PY" $E serve --port 9100 --paper 58 --encoding big5hkscs --out prints/58 > prints/58.log 2>&1 &
          "$PY" $E serve --port 9101 --paper 80 --encoding big5hkscs --out prints/80 > prints/80.log 2>&1 &
          "$PY" $E serve --port 9102 --paper 80 --encoding big5hkscs --out prints/80-raster > prints/80-raster.log 2>&1 &
          sleep 3
          app="build/Build/Products/Debug-iphonesimulator/StudioXPOS.app"
          bundle=tw.studiox.pos
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          dev="$IPAD"
          limit 60 xcrun simctl boot "$dev" || true
          limit 300 xcrun simctl bootstatus "$dev" -b || true
          limit 20 xcrun simctl terminate "$dev" "$bundle" 2>/dev/null || true
          limit 30 xcrun simctl uninstall "$dev" "$bundle" 2>/dev/null || true
          limit 180 xcrun simctl install "$dev" "$app" || echo "   安裝逾時"
          # 開機後第一次啟動偶爾卡住（App 根本沒開、什麼都沒印）：45 秒還沒開始印就關掉重開一次
          launch() {
            limit 20 xcrun simctl terminate "$dev" "$bundle" 2>/dev/null || true
            ( limit 110 xcrun simctl launch --console-pty "$dev" "$bundle" -demo cafe -autologin 1234 -section order -printerLab 127.0.0.1 > "prints/app-$1.log" 2>&1 ) &
            for i in $(seq 1 100); do
              grep -q "PrinterLab: done" "prints/app-$1.log" 2>/dev/null && return 0
              if [ "$i" -ge 45 ] && ! grep -q "PrinterLab" "prints/app-$1.log" 2>/dev/null; then return 1; fi
              sleep 1
            done
            return 1
          }
          sleep 5
          launch 1 || { echo "第一次沒開始印：重開"; launch 2 || true; }
          sleep 5
          for f in prints/app-*.log; do echo "== $f"; grep "PrinterLab" "$f" || tail -40 "$f"; done
          for f in prints/58.log prints/80.log prints/80-raster.log; do echo "== $f"; cat "$f"; done
          limit 60 xcrun simctl shutdown "$dev" || true

      # 店員手上的點餐機：iPhone 直的（同一個模擬器版本的 App：裝置家族有 iPhone）。上面選、下面做；結帳在結帳櫃台
      - name: 截圖（iPhone）
        if: env.IPHONE != ''
        timeout-minutes: 15
        continue-on-error: true
        run: |
          app="build/Build/Products/Debug-iphonesimulator/StudioXPOS.app"
          bundle=tw.studiox.pos
          mkdir -p shots/phone shots/logs
          P="-demo cafe -autologin 1234"
          # 名稱|啟動參數|等幾秒（預設 7）
          phone=(
            "phone/01-order|$P -section order|16"
            "phone/02-ticket|$P -section order -preselect|9"
            "phone/03-floor|$P -section floor"
            "phone/04-orders|$P -section orders"
            # $P 是晨麥手作（-demo 只看第一個）：黃毛丫頭自己寫
            "phone/05-yellowgirl-order|-demo yellowgirl -autologin 1234 -section order|16"
            # 手機用相機掃碼：掃到折價券 WELCOME100（新會員 100 元、滿 300）→ 打開單子看得到套上去了
            "phone/06-coupon|$P -section order -scanDemo WELCOME100|10"
            # 手機的現金模式（更多 → 這支手機也能收款 → 現金模式）：點餐頁下面常駐鍵盤；打 120 →「收現金 NT$120」
            "phone/08-cash|-demo yellowgirl -autologin 1234 -section order -phoneTakesPayment YES -cashMode YES|14"
            "phone/09-cash-typed|-demo yellowgirl -autologin 1234 -section order -phoneTakesPayment YES -cashMode YES -typeDigits 120|14"
            # 用 StudioX 帳號登入的個人手機：鎖定畫面是 Face ID／手機密碼（不是 PIN、不能換人）
            "phone/07-personal-lock|-demo cafe -autologin 1234 -personal -lockNow"
            # 配對畫面（沒有示範）：最上面是「用 StudioX 帳號登入」，配對碼在下面
            "phone/00-pairing|"
          )
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          dev="$IPHONE"
          echo "== 開機 $IPHONE_NAME $(date +%T)"
          limit 60 xcrun simctl boot "$dev" || true
          limit 300 xcrun simctl bootstatus "$dev" -b || true
          limit 30 xcrun simctl status_bar "$dev" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4 || true
          limit 30 xcrun simctl ui "$dev" appearance dark || true
          sleep 3
          for scene in "${phone[@]}"; do
            IFS='|' read -r name args wait <<< "$scene"
            echo "-- $name $(date +%T)"
            limit 20 xcrun simctl terminate "$dev" "$bundle" 2>/dev/null || true
            # 每張都重新安裝：示範模式的資料、這台的設定都從乾淨的開始
            limit 30 xcrun simctl uninstall "$dev" "$bundle" 2>/dev/null || true
            limit 180 xcrun simctl install "$dev" "$app" || echo "   安裝逾時"
            # App 自己印的錯誤（Swift 的 Fatal error、SwiftUI 的檢查）收在 shots/logs/
            log="shots/logs/$(basename "$name").log"
            # --console-pty：App 的 stdout／stderr 接到這裡（Swift 的 Fatal error 會印在這）；背景跑，截完圖再收
            ( limit $(( ${wait:-7} + 8 )) xcrun simctl launch --console-pty "$dev" "$bundle" $args > "$log" 2>&1 ) &
            sleep "${wait:-7}"
            limit 30 xcrun simctl io "$dev" screenshot "shots/$name.png" >/dev/null 2>&1 || echo "   截圖逾時"
            # 當掉的話下一步「當機報告」會印出位置；console-pty 收的輸出在 shots/logs/
            wait 2>/dev/null || true
          done
          limit 60 xcrun simctl shutdown "$dev" || true
          ls shots/phone | wc -l
          for f in shots/logs/*.log; do [ -s "$f" ] && { echo "== $f"; tail -60 "$f"; }; done || true

      # App 當掉的話：把模擬器的當機報告放進 artifact，並在這裡印出當掉的位置
      - name: 當機報告
        if: always()
        run: |
          mkdir -p shots/crashes
          # 這次執行之後產生的所有當機報告（名稱不一定是 StudioXPOS 開頭）
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -newer build.log \( -name "*.ips" -o -name "*.crash" \) 2>/dev/null | tee shots/crashes/list.txt
          grep -il "studioxpos\|tw.studiox.pos" $(cat shots/crashes/list.txt) 2>/dev/null | while read -r f; do cp "$f" shots/crashes/; done || true
          ls shots/crashes
          for f in shots/crashes/*.ips; do
            [ -f "$f" ] || continue
            echo "== $f"
            python3 - "$f" <<'PY' || true
          import json, sys
          raw = open(sys.argv[1]).read()
          _, _, body = raw.partition("\n")
          d = json.loads(body)
          print("exception:", d.get("exception"))
          print("termination:", d.get("termination", {}).get("indicator"))
          for k, v in (d.get("asi") or {}).items():
              print("asi:", k, v)
          imgs = d.get("usedImages", [])
          ft = d.get("faultingThread", 0)
          for fr in d["threads"][ft]["frames"][:30]:
              i = fr.get("imageIndex")
              img = imgs[i].get("name", "?") if i is not None and i < len(imgs) else "?"
              print("  ", img, fr.get("symbol", "?"), fr.get("sourceFile", ""), fr.get("sourceLine", ""))
          PY
          done

      - name: 截圖放在這次執行（逾時也放）
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: |
            shots/
            prints/
          if-no-files-found: ignore

      - name: 縮小、提交回分支
        if: always()
        run: |
          if ! ls shots/*.png >/dev/null 2>&1 && ! ls shots/phone/*.png >/dev/null 2>&1 && ! ls prints/*/*.png >/dev/null 2>&1; then echo "沒有截到"; exit 0; fi
          mkdir -p docs/screenshots/light docs/screenshots/phone
          # 哪一輪有截到才換掉那一輪的舊圖（iPhone 那輪失敗時不會把舊的手機截圖刪掉）
          if ls shots/*.png >/dev/null 2>&1; then rm -f docs/screenshots/*.jpg docs/screenshots/light/*.jpg; fi
          if ls shots/phone/*.png >/dev/null 2>&1; then rm -f docs/screenshots/phone/*.jpg; fi
          for f in shots/*.png shots/light/*.png shots/phone/*.png; do
            [ -f "$f" ] || continue
            out="docs/screenshots/${f#shots/}"
            sips -Z 1600 -s format jpeg -s formatOptions 72 "$f" --out "${out%.png}.jpg" >/dev/null
            # iPad 轉成橫的時候，截圖還是照直的畫面存（內容順時針轉了 90 度）：轉回來
            case "$f" in shots/phone/*) ;; *) [ -f shots/.rotated ] && sips -r 270 "${out%.png}.jpg" >/dev/null ;; esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 列印實測印出來的（虛擬出單機畫的圖）
          if ls prints/*/*.png >/dev/null 2>&1; then
            rm -rf docs/print-samples && mkdir -p docs/print-samples
            for d in prints/*/; do n=$(basename "$d"); mkdir -p "docs/print-samples/$n"; cp "$d"*.png "docs/print-samples/$n/"; done
            cp prints/*.log docs/print-samples/ 2>/dev/null || true
          fi
          # 接在分支最新的那一筆後面、只提交截圖與列印圖（不用 rebase：圖檔衝突解不開；分支上新的程式也不會被蓋掉）
          for i in 1 2 3; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q "origin/$GITHUB_REF_NAME"
            # 只加這一次真的重拍的（[phone-only] 時不會把舊的 iPad 截圖蓋回去）
            ls shots/*.png >/dev/null 2>&1 && git add -A -- docs/screenshots ':!docs/screenshots/phone'
            ls shots/phone/*.png >/dev/null 2>&1 && git add -A docs/screenshots/phone
            ls prints/*/*.png >/dev/null 2>&1 && git add -A docs/print-samples
            if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
            git commit -q -m "UI 截圖（自動）[skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
